<script>
const PAGE_SIZE = 6;
let currentPage = 1;
let ALL_ANNOUNCEMENTS = [];

function renderAnnouncements(){
  const q = (document.getElementById('annSearch').value || '').toLowerCase();
  const filtered = ALL_ANNOUNCEMENTS.filter(a =>
    !q || a.title.toLowerCase().includes(q) || a.description.toLowerCase().includes(q));

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = 1;
  const pageItems = filtered.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

  const grid = document.getElementById('annGrid');
  if(!pageItems.length){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-5 4 4 5-6 4 5"/></svg>
      <p>No announcements match your search.</p></div>`;
  } else {
    grid.innerHTML = pageItems.map((a,i)=>`
      <div class="card reveal in" style="--i:${i%6}">
        <div class="card-media">${a.cover_image ? `<img src="${a.cover_image}" alt="">` : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--light);"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-5 4 4 5-6 4 5"/></svg></div>`}</div>
        <div class="card-body">
          <span class="tag">${fmtDate(a.date_posted)}</span>
          <h3 style="margin-top:12px;font-size:1.1rem;">${escapeHtml(a.title)}</h3>
          <p style="font-size:.88rem;">${escapeHtml(a.description)}</p>
          <p style="font-size:.75rem;color:var(--ink-faint);margin-bottom:16px;">Posted by ${escapeHtml(a.posted_by||'iConnect Officers')}</p>
          <button class="btn btn-outline btn-sm ann-readmore" data-title="${escapeHtml(a.title)}" data-desc="${escapeHtml(a.description)}">Read More</button>
        </div>
      </div>`).join('');
  }

  const pag = document.getElementById('pagination');
  pag.innerHTML = totalPages > 1 ? Array.from({length: totalPages}, (_,i)=>
    `<button class="${i+1===currentPage?'active':''}" data-page="${i+1}">${i+1}</button>`).join('') : '';
  pag.querySelectorAll('button').forEach(b => b.addEventListener('click', ()=>{
    currentPage = parseInt(b.dataset.page); renderAnnouncements();
    document.getElementById('annGrid').scrollIntoView({behavior:'smooth', block:'start'});
  }));

  grid.querySelectorAll('.ann-readmore').forEach(btn => btn.addEventListener('click', ()=>{
    alert(`${btn.dataset.title}\n\n${btn.dataset.desc}`);
  }));
}

(async function(){
  ALL_ANNOUNCEMENTS = await getAnnouncements();
  renderAnnouncements();
  document.getElementById('annSearch').addEventListener('input', ()=>{ currentPage = 1; renderAnnouncements(); });
})();
</script>
