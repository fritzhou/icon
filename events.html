<script>
let ALL_EVENTS = [];
let activeStatus = 'all';

function renderEvents(){
  const q = (document.getElementById('eventSearch').value || '').toLowerCase();
  const filtered = ALL_EVENTS.filter(e =>
    (activeStatus === 'all' || e.status === activeStatus) &&
    (!q || e.title.toLowerCase().includes(q) || (e.venue||'').toLowerCase().includes(q)));

  const grid = document.getElementById('eventsGrid');
  if(!filtered.length){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <p>No events match your filters.</p></div>`;
    return;
  }
  grid.innerHTML = filtered.map((e,i)=>`
    <div class="card reveal in" style="--i:${i%6}">
      <div class="card-media">${e.banner_url ? `<img src="${e.banner_url}" alt="">` : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--light);"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>`}</div>
      <div class="card-body">
        <span class="tag tag-status-${e.status}">${e.status}</span>
        <h3 style="margin-top:12px;font-size:1.1rem;">${escapeHtml(e.title)}</h3>
        <p style="font-size:.85rem;margin-bottom:4px;">${escapeHtml(e.description||'')}</p>
        <p style="font-size:.8rem;color:var(--ink-faint);margin:0;">📅 ${fmtDate(e.date)} ${e.time?`· ${e.time}`:''}</p>
        <p style="font-size:.8rem;color:var(--ink-faint);margin:0;">📍 ${escapeHtml(e.venue||'TBA')}</p>
      </div>
    </div>`).join('');
}

document.getElementById('statusChips').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  activeStatus = chip.dataset.status;
  renderEvents();
});
document.getElementById('eventSearch').addEventListener('input', renderEvents);

(async function(){
  ALL_EVENTS = await getEvents();
  renderEvents();
})();
</script>
