<body>

<div class="dash-shell">
  <!-- ============ SIDEBAR ============ -->
  <aside class="dash-side" id="dashSide">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="12" cy="18" r="2.4"/><path d="M8.1 7.3 10.6 15.4M15.9 7.3 13.4 15.4M8.3 6h7.4"/></svg></span>
      iConnect

    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="dash-main">
    <div class="dash-topbar">
      <div>
        <button class="btn btn-ghost btn-sm" id="mobileSideToggle" style="display:none; margin-bottom:10px;">☰ Menu</button>
        <h2 id="sectionTitle" style="margin:0; font-size:1.6rem;">Overview</h2>
        <p style="margin:0; font-size:.85rem;" id="sectionSubtitle">Welcome back to the iConnect admin dashboard.</p>
      </div>
      <div class="dash-user">
        <span class="role-badge" id="roleBadge">—</span>
        <span id="userName" style="font-weight:600;">—</span>
      </div>
    </div>

    <div id="dashContent"><!-- sections rendered by dashboard.js --></div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>
