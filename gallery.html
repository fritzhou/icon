<script>
let ALL_GALLERY = [];
let activeEvent = 'all';

function placeholderMedia(){
  return `<div style="display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;background:var(--grad-soft);color:var(--light);">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
  </div>`;
}

function renderGallery(){
  const q = (document.getElementById('galSearch').value || '').toLowerCase();
  const filtered = ALL_GALLERY.filter(g =>
    (activeEvent === 'all' || g.event === activeEvent) &&
    (!q || (g.title||'').toLowerCase().includes(q) || (g.event||'').toLowerCase().includes(q)));

  const wrap = document.getElementById('galMasonry');
  if(!filtered.length){
    wrap.innerHTML = `<div class="empty-state"><p>No photos match your search.</p></div>`;
    return;
  }
  wrap.innerHTML = filtered.map((g,i)=>`
    <div class="g-item reveal in" style="--i:${i%6}" data-img="${g.image_url||''}" data-title="${escapeHtml(g.title||'')}" data-cap="${escapeHtml(g.event||'')} · ${escapeHtml(g.uploaded_by||'')} · ${fmtDate(g.upload_date)}">
      ${g.image_url ? `<img src="${g.image_url}" alt="${escapeHtml(g.title||'')}">` : placeholderMedia()}
      <div class="g-caption"><div class="cap-title">${escapeHtml(g.title||'')}</div><div class="cap-meta">${escapeHtml(g.event||'')} · ${fmtDate(g.upload_date)}</div></div>
    </div>`).join('');

  wrap.querySelectorAll('.g-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      const img = item.dataset.img;
      if(!img) return;
      document.getElementById('lightboxImg').src = img;
      document.getElementById('lightboxCap').textContent = `${item.dataset.title} — ${item.dataset.cap}`;
      document.getElementById('lightbox').classList.add('open');
    });
  });
}

document.getElementById('lightboxClose').addEventListener('click', ()=> document.getElementById('lightbox').classList.remove('open'));
document.getElementById('lightbox').addEventListener('click', (e)=>{ if(e.target.id==='lightbox') e.currentTarget.classList.remove('open'); });

document.getElementById('galSearch').addEventListener('input', renderGallery);

(async function(){
  ALL_GALLERY = await getGallery();
  const events = [...new Set(ALL_GALLERY.map(g=>g.event).filter(Boolean))];
  const chipsWrap = document.getElementById('eventChips');
  chipsWrap.innerHTML += events.map(ev=> `<div class="chip" data-event="${escapeHtml(ev)}">${escapeHtml(ev)}</div>`).join('');
  chipsWrap.addEventListener('click', (e)=>{
    const chip = e.target.closest('.chip');
    if(!chip) return;
    document.querySelectorAll('#eventChips .chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeEvent = chip.dataset.event;
    renderGallery();
  });
  renderGallery();
})();
</script>
